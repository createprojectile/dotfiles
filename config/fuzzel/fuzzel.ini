# ============================================================================
#  fuzzel · Ayu Dark
#  Минималистичный Wayland-лаунчер. Открывается по Mod+D / Mod+Space.
#  Цвета в формате RRGGBBAA (без #).
# ============================================================================

[main]
font=JetBrainsMono Nerd Font:size=11
dpi-aware=no
prompt="  "
icons-enabled=yes
icon-theme=Papirus-Dark
terminal=alacritty
lines=10
width=44
horizontal-pad=20
vertical-pad=18
inner-pad=10
line-height=28
letter-spacing=0
layer=overlay
anchor=center
match-mode=normal

[colors]
background=0a0e14f2
text=bfbdb6ff
prompt=59c2ffff
placeholder=565b66ff
input=bfbdb6ff
match=59c2ffff
selection=11151cff
selection-text=bfbdb6ff
selection-match=59c2ffff
counter=565b66ff
border=1f2630ff

[border]
width=1
radius=12

[dmenu]
exit-immediately-if-empty=yes
